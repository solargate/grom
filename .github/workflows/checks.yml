name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build smoke
        run: go build -o /dev/null ./cmd/grom

  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Analyze
        working-directory: ui/grom
        run: flutter analyze

      - name: Test
        working-directory: ui/grom
        run: flutter test

  android-unit:
    name: Android unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        working-directory: ui/grom/android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

  swagger:
    name: Swagger
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@v1.16.6

      - name: Check swagger docs are up to date
        run: |
          make apidoc
          git diff --exit-code api/docs

  changelog:
    name: Changelog notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test changelog note extraction
        run: scripts/changelog_notes_test.sh

  catalog:
    name: Server catalog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python tooling
        run: pip install -r requirements.txt

      - name: Test catalog generator
        run: python scripts/server_catalog_test.py

      - name: Check generated catalog is up to date
        run: |
          python scripts/server_catalog.py generate
          git diff --exit-code ui/grom/lib/generated/server_catalog.g.dart
