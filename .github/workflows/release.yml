name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate tag against master and VERSION
        id: check
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          VERSION="$(tr -d '[:space:]' < VERSION)"

          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${TAG}' is not a semver X.Y.Z version"
            exit 1
          fi

          if [[ "$TAG" != "$VERSION" ]]; then
            echo "::error::Tag '${TAG}' does not match VERSION file ('${VERSION}')"
            exit 1
          fi

          git fetch origin master
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/master; then
            echo "::error::Tag '${TAG}' (commit ${GITHUB_SHA}) is not on master"
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Validated tag ${TAG} matches VERSION and is on master"

  test:
    name: Test
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Go tests
        run: go test ./...

      - name: Flutter tests
        working-directory: ui/grom
        run: flutter test

  build-server:
    name: Build server
    needs: [validate, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build embedded web UI
        run: make web

      - name: Cross-compile and package server binaries
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          LDFLAGS="-X github.com/solargate/grom/internal/version.Version=${VERSION}"
          mkdir -p dist

          build_and_package() {
            local goos="$1"
            local goarch="$2"
            local archive_ext="$3"
            local bin_name="grom"
            if [[ "$goos" == "windows" ]]; then
              bin_name="grom.exe"
            fi

            local pkg="grom-${VERSION}-${goos}-${goarch}"
            local outdir="build/${pkg}"
            rm -rf "${outdir}"
            mkdir -p "${outdir}"

            echo "Building ${pkg}..."
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build -ldflags "${LDFLAGS}" -o "${outdir}/${bin_name}" ./cmd/grom

            cp -a cmd/grom/config-examples "${outdir}/config-examples"

            if [[ "$archive_ext" == "tar.gz" ]]; then
              tar -C build -czf "dist/${pkg}.tar.gz" "${pkg}"
            else
              (cd build && zip -r "../dist/${pkg}.zip" "${pkg}")
            fi
          }

          build_and_package linux   amd64 tar.gz
          build_and_package darwin  arm64 zip
          build_and_package darwin  amd64 zip
          build_and_package windows amd64 zip

          ls -la dist/

      - name: Upload server packages
        uses: actions/upload-artifact@v6
        with:
          name: server-packages
          path: dist/
          if-no-files-found: error

  build-apk:
    name: Build Android APK
    needs: [validate, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Build release APK
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        working-directory: ui/grom
        run: flutter build apk --release --build-name="${VERSION}" --build-number=1

      - name: Stage APK artifact
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp ui/grom/build/app/outputs/flutter-apk/app-release.apk "dist/grom-${VERSION}.apk"
          ls -la dist/

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: android-apk
          path: dist/grom-*.apk
          if-no-files-found: error

  release:
    name: Create draft release
    needs: [validate, build-server, build-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download server packages
        uses: actions/download-artifact@v7
        with:
          name: server-packages
          path: artifacts

      - name: Download APK
        uses: actions/download-artifact@v7
        with:
          name: android-apk
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ needs.validate.outputs.version }}
          draft: true
          body: ''
          files: artifacts/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
