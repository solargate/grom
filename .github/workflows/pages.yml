name: Pages

on:
  push:
    branches: [master]
    paths:
      - 'PRIVACY.md'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [master]
    paths:
      - 'PRIVACY.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build site from PRIVACY.md
        run: |
          set -euo pipefail
          mkdir -p site
          {
            cat <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Privacy Policy</title>
          <style>
            body {
              font-family: system-ui, sans-serif;
              max-width: 40rem;
              margin: 2rem auto;
              padding: 0 1rem;
              line-height: 1.5;
            }
          </style>
          </head>
          <body>
          EOF
            pandoc PRIVACY.md
            printf '</body>\n</html>\n'
          } > site/privacy.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
