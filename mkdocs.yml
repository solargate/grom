site_name: Grom
site_description: Self-hosted workout tracker with optional ActivityPub federation
site_url: https://solargate.github.io/grom/
repo_url: https://github.com/solargate/grom
repo_name: solargate/grom
edit_uri: edit/master/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: README.md
  - User:
      - Overview: user/overview.md
      - Grom API tokens: user/grom-api-tokens.md
      - Delete account: user/delete-account.md
  - Admin:
      - Install and run: admin/install.md
      - Configuration: admin/configuration.md
  - Integrations:
      - Strava bulk import: integrations/strava-bulk-import.md
      - Health Sync + Google Drive: integrations/health-sync-google-drive.md
  - Privacy Policy: privacy.md

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ru
          name: Русский
          build: true
          site_description: Self-hosted трекер тренировок с необязательной федерацией ActivityPub
          nav_translations:
            Home: Главная
            User: Пользователь
            Overview: Обзор
            Grom API tokens: API-токены Grom
            Delete account: Удаление аккаунта
            Admin: Администрирование
            Install and run: Установка и запуск
            Configuration: Конфигурация
            Integrations: Интеграции
            Strava bulk import: Массовый импорт Strava
            Health Sync + Google Drive: Health Sync + Google Drive
            Privacy Policy: Политика конфиденциальности
        - locale: de
          name: Deutsch
          build: true
          site_description: Self-hosted Trainings-Tracker mit optionaler ActivityPub-Föderation
          nav_translations:
            Home: Start
            User: Benutzer
            Overview: Überblick
            Grom API tokens: Grom-API-Token
            Delete account: Konto löschen
            Admin: Administration
            Install and run: Installation und Start
            Configuration: Konfiguration
            Integrations: Integrationen
            Strava bulk import: Strava-Massenimport
            Health Sync + Google Drive: Health Sync + Google Drive
            Privacy Policy: Datenschutzrichtlinie

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

strict: true
