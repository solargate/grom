# Full configuration reference with every supported field and comments.
# Prefer the shorter profile examples (config.dev.*.yaml / config.prod.*.yaml)
# for day-to-day use; copy from this file only when you need an option that
# those profiles omit. Values below are illustrative defaults / placeholders.

server:
  # Optional. Human-readable server name shown in the UI and federation metadata.
  name: "Grom"
  # Optional. HTTP listen port. Default: 8080.
  # When TLS is on, this port is used for redirect / ACME HTTP-01.
  port: 8080
  tls:
    # Optional. TLS mode: off | static | autocert. Default: off (or static if enabled is true).
    mode: off
    # Optional. Legacy flag; true is treated as mode: static when mode is unset. Prefer mode.
    enabled: false
    # Optional. HTTPS listen port. Unused when mode is off. Defaults: 8443 (static), 443 (autocert).
    port: 8443
    # Optional. Path to TLS certificate. Required when mode is static.
    # Relative paths are resolved against the grom binary directory.
    cert_file: ""
    # Optional. Path to TLS private key. Required when mode is static.
    # Relative paths are resolved against the grom binary directory.
    key_file: ""
    autocert:
      # Optional. Contact email for Let's Encrypt. Used only when mode is autocert.
      email: ""
      # Optional. ACME certificate cache directory. Default: {storage.location}/acme-cache.
      # Relative paths are resolved against the grom binary directory.
      cache_dir: ""
      # Optional. Domains for which to obtain certificates. Default: [federation.domain host].
      domains: []

federation:
  # Optional. Enable ActivityPub federation. Requires TLS (mode static or autocert). Default: false.
  enabled: false
  # Optional. Public host (and optional :port for static TLS). Required when federation is enabled or mode is autocert.
  # For autocert use hostname only (no port).
  domain: ""
  # Optional. Automatically Accept incoming Follow activities. Default: false.
  auto_accept_follows: false
  # Optional. Number of outbound delivery workers. Default: 2.
  delivery_workers: 2
  # Optional. Max delivery attempts per activity before giving up. Default: 5.
  delivery_retry_max: 5
  # Optional. Path to a CA certificate to trust for outbound federation HTTPS (useful with self-signed peers).
  # Relative paths are resolved against the grom binary directory.
  ca_cert_file: ""
  # Optional. Skip TLS verification for outbound federation HTTPS. Dev only; never use in production. Default: false.
  tls_insecure_skip_verify: false

auth:
  # Required. Secret used to sign JWT access tokens. Use a long random string.
  jwt_secret: "REPLACE_WITH_STRONG_SECRET"
  # Optional. JWT lifetime in hours. Default: 24.
  jwt_ttl_hours: 24

storage:
  # Optional. Storage backend driver: file | bbolt | postgres. Default: file (only file is implemented).
  driver: file
  # Optional. Root directory for application data. Default: data.
  # Relative paths are resolved against the grom binary directory.
  location: data
  # Optional. Directory for temporary uploads and imports. Default: tmp.
  # Relative paths are resolved against the grom binary directory.
  temp_dir: tmp
  bbolt:
    # Optional. Path to the BBolt database file. Used only when driver is bbolt.
    path: ""
  postgres:
    # Optional. PostgreSQL DSN. Used only when driver is postgres.
    dsn: ""
