# Full configuration reference with every supported field and comments.
# Prefer the shorter profile examples (config.dev.*.yaml / config.prod.*.yaml)
# for day-to-day use; copy from this file only when you need an option that
# those profiles omit. Values below are illustrative defaults / placeholders.

server:
  # Optional. Human-readable server name shown in the UI and federation metadata.
  name: "Grom"
  # Optional. HTTP listen port. Default: 8080.
  # When TLS is on, this port is used for redirect / ACME HTTP-01.
  port: 8080
  tls:
    # Optional. TLS mode: off | static | autocert. Default: off (or static if enabled is true).
    mode: off
    # Optional. Legacy flag; true is treated as mode: static when mode is unset. Prefer mode.
    enabled: false
    # Optional. HTTPS listen port. Unused when mode is off. Defaults: 8443 (static), 443 (autocert).
    port: 8443
    # Optional. Path to TLS certificate. Required when mode is static.
    # Relative paths are resolved against the grom binary directory.
    cert_file: ""
    # Optional. Path to TLS private key. Required when mode is static.
    # Relative paths are resolved against the grom binary directory.
    key_file: ""
    autocert:
      # Optional. Contact email for Let's Encrypt. Used only when mode is autocert.
      email: ""
      # Optional. ACME certificate cache directory. Default: acme-cache (next to the grom binary).
      # Relative paths are resolved against the grom binary directory.
      cache_dir: ""
      # Optional. Domains for which to obtain certificates. Default: [federation.domain host].
      domains: []

federation:
  # Optional. Enable ActivityPub federation. Requires TLS (mode static or autocert). Default: false.
  enabled: false
  # Optional. Public host (and optional :port for static TLS). Required when federation is enabled or mode is autocert.
  # For autocert use hostname only (no port).
  domain: ""
  # Optional. Automatically Accept incoming Follow activities. Default: false.
  auto_accept_follows: false
  # Optional. Number of outbound delivery workers. Default: 2.
  delivery_workers: 2
  # Optional. Max delivery attempts per activity before giving up. Default: 5.
  delivery_retry_max: 5
  # Optional. Path to a CA certificate to trust for outbound federation HTTPS (useful with self-signed peers).
  # Relative paths are resolved against the grom binary directory.
  ca_cert_file: ""
  # Optional. Skip TLS verification for outbound federation HTTPS. Dev only; never use in production. Default: false.
  tls_insecure_skip_verify: false

auth:
  # Required. Secret used to sign JWT access tokens. Use a long random string.
  jwt_secret: "REPLACE_WITH_STRONG_SECRET"
  # Optional. JWT lifetime in hours. Default: 24.
  jwt_ttl_hours: 24
  reset:
    # Required when mailer.driver is log or smtp. Public base URL for reset links (no trailing slash).
    public_base_url: "https://grom.example.com"
    # Optional. Reset token lifetime in minutes. Default: 60.
    token_ttl_minutes: 60
  captcha:
    # Optional. Require ALTCHA proof-of-work on register, login, and password forgot. Default: false.
    enabled: false
    # Optional. HMAC secret for challenge signatures. When empty, auth.jwt_secret is used.
    hmac_secret: ""
    # Optional. PBKDF2 iteration cost for PoW. Default: 1000.
    cost: 1000
    # Optional. Challenge lifetime in seconds. Default: 300.
    expires_seconds: 300

mailer:
  # Optional. Outbound email driver: off | log | smtp. Default: off.
  # log writes messages to the server log (dev). smtp uses an external SMTP relay (no local MTA).
  driver: off
  # Required when driver is log or smtp. Sender address, e.g. "Grom <noreply@example.com>".
  from: ""
  smtp:
    # Required when driver is smtp.
    host: ""
    # Required when driver is smtp. Common: 587 (STARTTLS) or 465 (implicit TLS).
    port: 587
    # Optional. SMTP username (leave empty for open local catchers).
    username: ""
    # Optional. SMTP password.
    password: ""
    # Optional. starttls | tls | none. Default: starttls (or tls when port is 465).
    encryption: starttls

storage:
  # Optional. Storage backend driver: file | bbolt | postgres. Default: file.
  # Implemented: file (YAML metadata), bbolt (JSON metadata in a Bolt DB; blobs stay on the filesystem).
  # Prefer bbolt for normal / production installs; file is mainly for tests or very small instances.
  # postgres is not implemented.
  driver: file
  # Optional. Root directory for application data (and blob files). Default: data.
  # Relative paths are resolved against the grom binary directory.
  location: data
  # Optional. Directory for temporary uploads and imports. Default: tmp.
  # Relative paths are resolved against the grom binary directory.
  temp_dir: tmp
  bbolt:
    # Optional. Path to the BBolt database file. Used only when driver is bbolt.
    # Default when empty: {storage.location}/grom.db
    path: ""
  postgres:
    # Optional. PostgreSQL DSN. Used only when driver is postgres (not implemented).
    dsn: ""

logging:
  # Optional. Minimum log level: debug | info | warn | error. Default: info.
  # When level is debug, Gin also runs in debug mode ([GIN-debug] route dumps); otherwise Gin release mode.
  level: info
  # Optional. Log format: json (machine-readable, recommended for production) or text (human-readable, useful in development). Default: json.
  format: json
